name: macOS ad-hoc build

on:
  push:
    branches: [main, ci/macos-adhoc, fix/chinese-search-isolation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Standard hosted runner is free for a public fork. Fail closed elsewhere.
    if: ${{ github.repository == 'xieshiqi147258/DigUp' && github.event.repository.fork && !github.event.repository.private && !contains(github.event.head_commit.message, '[startup-red]') }}
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      LLAMA_REVISION: 4d756bc72bf00a4aacf410ae15a2d315f3db400d
      SPARKLE_REVISION: eef1a539a373c1f1a320624b1130fc5de7b2e100

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check Apple Silicon toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee "$RUNNER_TEMP/digup-toolchain.log"
          grep -qx 'Xcode 26.0.1' "$RUNNER_TEMP/digup-toolchain.log"
          swift --version | tee -a "$RUNNER_TEMP/digup-toolchain.log"
          command -v cmake > /dev/null
          cmake --version | tee -a "$RUNNER_TEMP/digup-toolchain.log"

      - name: Resolve and verify fixed dependencies
        run: |
          set -euo pipefail
          mkdir -p Vendor
          git -c credential.helper= clone --depth 1 --branch b11461 \
            https://github.com/ggml-org/llama.cpp.git Vendor/llama.cpp
          test "$(git -C Vendor/llama.cpp rev-parse HEAD)" = "$LLAMA_REVISION"
          test "$(git -C Vendor/llama.cpp describe --tags --exact-match)" = b11461
          scripts/build-llama.sh 2>&1 | tee "$RUNNER_TEMP/digup-llama-build.log"
          test "$(git -C Vendor/llama.cpp rev-parse HEAD)" = "$LLAMA_REVISION"
          swift package resolve
          git diff --exit-code -- Package.resolved
          test "$(git -C .build/checkouts/Sparkle rev-parse HEAD)" = "$SPARKLE_REVISION"

      - name: Download the exact pinned public text and media models
        timeout-minutes: 12
        env:
          DIGUP_MODELS: ${{ runner.temp }}/digup-ci-models
        run: |
          set -euo pipefail
          mkdir -p "$DIGUP_MODELS"
          python3 - "$DIGUP_MODELS" <<'PYMODELS'
          import hashlib
          import subprocess
          import sys
          from pathlib import Path
          source = Path('Sources/DigUpKit/ModelFiles.swift').read_text()
          revision = 'bfcd298762cc34d0357ece5ebdd31791a3a374d8'
          assert f'public static let revision = "{revision}"' in source
          files = [
              ('embeddinggemma-2-Q8_0.gguf', 309855456, '2188ac1deca4b77dffefd603c2776a9d76d9d74ec01841392982ebb840b09135'),
              ('mmproj-embeddinggemma-2-Q8_0.gguf', 554821024, 'c4a8a52691ecef40618438928bdf9e68379b854e24166f292592353db0aab64f'),
          ]
          for name, size, digest in files:
              assert name in source and digest in source
              partial = Path(sys.argv[1]) / (name + '.partial')
              subprocess.run(['curl', '--fail', '--location', '--retry', '2', '--connect-timeout', '30',
                              '--max-time', '480', '--output', str(partial),
                              f'https://huggingface.co/ggml-org/embeddinggemma-2-GGUF/resolve/{revision}/{name}'],
                             check=True, timeout=500)
              assert partial.stat().st_size == size, name
              checksum = hashlib.sha256()
              with partial.open('rb') as file:
                  while chunk := file.read(8 << 20): checksum.update(chunk)
              assert checksum.hexdigest() == digest, name
              partial.replace(Path(sys.argv[1]) / name)
              print(f'Verified {name}: {size} bytes, SHA-256 {digest}', flush=True)
          PYMODELS
          echo 'Pinned text and media models verified; native inference, reference and no-match controls required.' \
            | tee "$RUNNER_TEMP/digup-model-coverage.log"

      - name: Test with both pinned models
        timeout-minutes: 12
        id: tests
        env:
          DIGUP_MODELS: ${{ runner.temp }}/digup-ci-models
        run: |
          set -euo pipefail
          mkdir -p "$DIGUP_MODELS"
          test -s "$DIGUP_MODELS/embeddinggemma-2-Q8_0.gguf"
          test -s "$DIGUP_MODELS/mmproj-embeddinggemma-2-Q8_0.gguf"
          echo 'Both pinned models required. Full reference compatibility and real-vector semantic controls enabled.'
          python3 scripts/test-release-guards.py
          python3 scripts/test-localization-checker.py 2>&1 | tee "$RUNNER_TEMP/digup-localization-checker-tests.log"
          python3 scripts/check-localization.py 2>&1 | tee "$RUNNER_TEMP/digup-localization-resources.log"
          swift build --jobs 2 --product digup 2>&1 | tee "$RUNNER_TEMP/digup-test-helper-build.log"
          export DIGUP_TEST_HELPER="$(swift build --show-bin-path)/digup"
          test -x "$DIGUP_TEST_HELPER"
          python3 -u scripts/run-bounded-tests.py --seconds 300 --log "$RUNNER_TEMP/digup-legacy-media-test.log" \
            swift test --jobs 2 --no-parallel --filter LegacyMediaRecoveryTests
          # Run the blocking AVFoundation regressions in their own process, then the complete suite.
          python3 -u scripts/run-bounded-tests.py --seconds 300 --log "$RUNNER_TEMP/digup-media-focused-test.log" \
            swift test --jobs 2 --no-parallel --filter MediaEmbeddingFailureTests
          # Blocking AVFoundation bridges must not occupy all Swift Testing cooperative executor threads.
          python3 -u scripts/run-bounded-tests.py --seconds 480 --log "$RUNNER_TEMP/digup-swift-test.log" \
            swift test --jobs 2 --no-parallel
          test "$(grep -c 'MEDIA_RECOVERY_NEGATIVE ' "$RUNNER_TEMP/digup-swift-test.log")" -eq 6
          test "$(grep -c 'MEDIA_MULTIMODAL_REPLAY ' "$RUNNER_TEMP/digup-swift-test.log")" -eq 12
          grep -q 'MEDIA_RECOVERY_CLI_JSON real helper:' "$RUNNER_TEMP/digup-swift-test.log"
          grep -q 'vectorsMatchTheReference() passed' "$RUNNER_TEMP/digup-swift-test.log"

      - name: Build isolated ad-hoc testing bundle
        id: app
        env:
          SIGN_ID: '-'
          RELEASE: '0'
          BUNDLE_ID: io.github.xieshiqi147258.DigUp.ci
          VERSION: 0.0.0
          BUILD_NUMBER: ${{ github.run_number }}
          SPARKLE_FEED: https://example.invalid/digup-ci/appcast.xml
        run: |
          set -euo pipefail
          # Change the ephemeral build input before signing, never a signed bundle afterwards.
          /usr/libexec/PlistBuddy -c 'Set :SUEnableAutomaticChecks false' Resources/Info.plist
          ./build.sh 2>&1 | tee "$RUNNER_TEMP/digup-app-build.log"
          codesign --verify --deep --strict --verbose=2 build.noindex/DigUpTest.app
          plist=build.noindex/DigUpTest.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = io.github.xieshiqi147258.DigUp.ci
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")" = DigUpTest
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUEnableAutomaticChecks' "$plist")" = false
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$plist")" = https://example.invalid/digup-ci/appcast.xml
          codesign -d --verbose=4 build.noindex/DigUpTest.app/Contents/Helpers/digup-test \
            2> "$RUNNER_TEMP/digup-helper-identity.log"
          grep -qx 'Identifier=io.github.xieshiqi147258.DigUp.ci.helper' "$RUNNER_TEMP/digup-helper-identity.log"
          build.noindex/DigUpTest.app/Contents/Helpers/digup-test status > "$RUNNER_TEMP/digup-helper-status.log"
          test -f "$HOME/Library/Application Support/DigUpTest/index.noindex/index.sqlite"
          test ! -e "$HOME/Library/Application Support/DigUp"
          git diff --exit-code -- Package.resolved
          test "$(git -C .build/checkouts/Sparkle rev-parse HEAD)" = "$SPARKLE_REVISION"

      - name: Archive app and verify the extracted package
        id: archive
        run: |
          set -euo pipefail
          mkdir -p dist
          cp LICENSE build.noindex/LICENSE
          cp docs/ci-macos.md build.noindex/TESTING.md
          cp docs/chinese-regressions.md build.noindex/CHINESE-REGRESSIONS.md
          cp docs/startup-path-audit.md build.noindex/STARTUP-PATH-AUDIT.md
          cp docs/ui-localization-acceptance.md build.noindex/UI-LOCALIZATION.md
          cp docs/install-test-zh.txt build.noindex/INSTALL-ZH.txt
          cp docs/media-search-recovery.md build.noindex/MEDIA-RECOVERY.md
          {
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'Workflow run: %s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'llama.cpp: b11461 (%s) plus scripts/llama.cpp-no-logits.patch\n' "$LLAMA_REVISION"
            printf 'Sparkle: 2.10.0 (%s)\n' "$SPARKLE_REVISION"
            printf 'Signing: ad-hoc, no notarization. Exact pinned text and media models tested but not bundled.\n'
            printf 'Localization: English/Simplified Chinese unit/resource tests and relocated app resource/purpose smoke; offscreen AppKit startup/render smoke; on-screen layout and actual system dialogs remain unverified.\n'
            printf 'Tests: full native suite with both pinned models, real 4-clip/8-query audio replay, 12-query photo/screenshot/video/long-audio/Chinese-speech replay, six native no-match controls, mixed-modal search, media encoding-error/retry and legacy done-media reconciliation regressions, Chinese lexical/localized UI model checks and extracted-bundle smoke plus real extracted AppKit startup, persisted defaults and onboarding render. No private-file or full interactive GUI validation.\n'
            cat "$RUNNER_TEMP/digup-toolchain.log"
          } > build.noindex/BUILD-INFO.txt
          archive="DigUpTest-ci-macos-arm64-${GITHUB_SHA}.tar.gz"
          # tar preserves executable modes and symlinks; do not upload the .app directory directly.
          tar -czf "dist/$archive" -C build.noindex DigUpTest.app LICENSE TESTING.md CHINESE-REGRESSIONS.md STARTUP-PATH-AUDIT.md UI-LOCALIZATION.md INSTALL-ZH.txt MEDIA-RECOVERY.md BUILD-INFO.txt
          verify_dir="$(mktemp -d "$RUNNER_TEMP/digup-archive.XXXXXX")"
          tar -xzpf "dist/$archive" -C "$verify_dir"
          python3 - build.noindex/DigUpTest.app "$verify_dir/DigUpTest.app" <<'PY'
          import os
          import stat
          import sys
          from pathlib import Path

          def manifest(root):
              result = {}
              for directory, folders, files in os.walk(root, followlinks=False):
                  for name in folders + files:
                      path = Path(directory) / name
                      meta = path.lstat()
                      result[str(path.relative_to(root))] = (
                          stat.S_IFMT(meta.st_mode), stat.S_IMODE(meta.st_mode),
                          os.readlink(path) if path.is_symlink() else None,
                      )
              return result

          assert manifest(Path(sys.argv[1])) == manifest(Path(sys.argv[2])), 'Archive changed modes, paths or symlinks'
          PY
          test -x "$verify_dir/DigUpTest.app/Contents/MacOS/DigUpTest"
          test -x "$verify_dir/DigUpTest.app/Contents/Helpers/digup-test"
          codesign --verify --deep --strict --verbose=2 "$verify_dir/DigUpTest.app"
          python3 scripts/smoke-test-bundle.py --app "$verify_dir/DigUpTest.app" \
            --models "$RUNNER_TEMP/digup-ci-models" 2>&1 | tee "$RUNNER_TEMP/digup-bundle-smoke.log"
          python3 scripts/smoke-test-localization.py "$verify_dir/DigUpTest.app" 2>&1 | tee "$RUNNER_TEMP/digup-localization-smoke.log"
          python3 -u scripts/smoke-test-app-startup.py "$verify_dir/DigUpTest.app" 2>&1 | tee "$RUNNER_TEMP/digup-app-startup-smoke.log"
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256" && shasum -a 256 --check "$archive.sha256")

      - name: Upload testing package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digup-ci-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Record verification scope
        if: ${{ always() }}
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.app.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
        run: |
          {
            printf 'Tests: %s; app build: %s; archive verification: %s.\n\n' "$TEST_OUTCOME" "$BUILD_OUTCOME" "$ARCHIVE_OUTCOME"
            printf 'Pinned public text and media weights are verified. Reference compatibility, media replay and six native no-match controls are required; skips do not meet acceptance.\n\n'
            printf 'This ad-hoc, non-notarized testing package is not an official release or an end-to-end validation.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build and test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digup-ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/digup-*.log
            ${{ runner.temp }}/digup-startup-*.png
          if-no-files-found: ignore
          retention-days: 7
